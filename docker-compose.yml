services:
  app:
    build: .
    ports:
      - "8088:8088"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      JEV_CONFIDENCE_THRESHOLD: ${JEV_CONFIDENCE_THRESHOLD:-0.80}
      JEV_ESCALATION_PROBABILITY: ${JEV_ESCALATION_PROBABILITY:-0.50}
      NIFI_MODE: ${NIFI_MODE:-emulated}
      NIFI_BASE_URL: https://nifi:8443/nifi-api
      NIFI_USERNAME: ${NIFI_USERNAME:-admin}
      NIFI_PASSWORD: ${NIFI_PASSWORD:-ChangeMeAeroNCR2026!}
      NIFI_VERIFY_TLS: "false"
    depends_on:
      - nifi

  nifi:
    image: apache/nifi:2.11.0
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:-admin}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:-ChangeMeAeroNCR2026!}
    volumes:
      - nifi_state:/opt/nifi/nifi-current/state

volumes:
  nifi_state:
